rder-radius:9px;padding:8px 11px;margin:12px 6px 0 0;color:#2447ba;text-decoration:none}.comment{border-left:3px solid #9aacef;background:#f8faff;padding:12px;margin-top:14px;white-space:pre-wrap}.copy{border-radius:8px;color:#3156d3;margin-top:12px}.source{color:#dce6ff;text-decoration:underline}.empty{display:none;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.9rem}@media(max-width:600px){.top{padding-top:30px}.card{padding:16px}.bar{position:relative}}</style></head><body><header class="top"><div class="eyebrow">숏.한국 / 1106 디지털배움터 · 원문 게시물 23개 수록</div><h1>AI 자기소개서 실습</h1><p>인터뷰부터 경험 정리, 자기소개서 작성·검증, 채용공고 매칭까지</p><p><a class="source" href="https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq" target="_blank" rel="noopener">강의 원문 Padlet 열기 ↗</a></p></header><nav class="bar"><input id="q" type="search" placeholder="자료 검색"><div class="filters" id="filters"></div></nav><main class="wrap" id="content"></main><script>const posts=[{"section":"AI 인터뷰","title":"AI 인터뷰어 프롬프트","body":"너는 20년 경력의 커리어 컨설턴트야.\n\n나는 {희망 직무: 예) 사무행정 / 마케팅 / 복지기관 실무}에 지원하려고 해.\n\n나의 상황은 {예) 첫 취업 준비 중인 졸업생 / 오랜만에 재취업하는 40대}야.\n\n지금부터 나를 인터뷰해서, 내 경험을 경력으로 엮어줘.\n\n1. 질문은 한 번에 하나씩만 해줘.\n\n2. 학교생활, 아르바이트, 동아리, 봉사, 취미, 가정생활, 모임, 배움 등 일상 경험을 폭넓게 물어봐줘.\n\n3. 내가 짧게 답하면 \"구체적으로 어떤 역할이었나요?\", \"몇 명, 몇 번, 얼마나 오래였나요?\"처럼 더 깊이 물어봐줘.\n\n4. 내가 \"이것도 경력이 될까요?\"라고 하면, 어떤 역량으로 연결되는지 설명해줘.\n\n5. 질문은 {8~10}개 정도로 하고, 인터뷰가 끝나면 아래를 정리해줘.\n\n   - 경력 연결고리 표 (경험 / 행동 / 역량 / 직무언어)\n\n   - 희망 직무와 가장 잘 맞는 핵심 역량 3가지\n\n   - 자기소개서용 문단 1개 ({500}자 내외)\n\n   - 면접 질문 \"관련 경력이 없는데 왜 잘할 수 있나요?\"에 대한 1분 답변\n\n6. 없는 사실을 지어내거나 과장하지 말고, 내가 말한 내용만 사용해줘.\n\n첫 질문부터 시작해줘.","comments":["시니어 AI 교육 전문 강사 지원 자기소개\n\n\n\n\n저는 중학교 국어교사로 8년, 초등학교 기초학력 강사로 3년간 근무하며 다양한 학습자를 지도해 온 교육 전문가입니다. 국어와 수학을 지도하면서 학습자의 수준과 속도에 맞춰 설명하고, 구체물을 활용하여 어려운 개념도 쉽게 이해하도록 돕는 교수법을 익혔습니다.\n\n\n\n\n최근에는 AI 프롬프트 2급 자격을 취득하고 생성형 AI를 활용한 블로그 자동화와 강의 슬라이드 제작을 실습하며 디지털 역량을 키우고 있습니다.\n\n\n\n\n이제는 그동안 쌓아 온 교육 경험과 새로운 AI 활용 역량을 결합하여 시니어 AI 교육 강사라는 새로운 도전에 나서고자 합니다.\n\n\n\n\n제가 지향하는 교육은 어려운 기술을 일방적으로 전달하는 강의가 아니라, 어르신들이 직접 따라 하고 경험하면서 생활 속에서 AI를 활용할 수 있도록 돕는 실습 중심 교육입니다. 챗GPT 기초와 프롬프트 작성법, AI 블로그 글쓰기 등을 쉽고 재미있게 가르치며 어르신들의 디지털 자신감과 삶의 가능성을 넓히는 강사가 되겠습니다."],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"AI 인터뷰","title":"경험소재 목록은 복사할수 있게 코드블럭으로 작성해줘","body":"","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"AI 인터뷰","title":"교안을 다운못받았어요 교안좀 부탁드립니다","body":"","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"AI 자기소개서","title":"STAR 작성 프롬프트","body":"나는 [사무행정직] 자기소개서에 사용할 경험을 STAR 방식으로 정리하려고 해.\n\n \n\n내 경험:\n\n[편의점 근무 중 교대 과정에서 일부 상품의 재고 확인이 빠지는 일이 반복됐다.\n\n 나는 품목별 확인 순서를 정하고, 확인이 필요한 상품을 표시한 뒤 다음 근무자와 함께 확인했다.\n\n 그 결과 인수인계가 이전보다 정리되고 재고 확인도 쉬워졌다.]\n\n \n\n위 경험을 S 상황 / T 과제 / A 행동 / R 결과로 정리해줘.\n\n특히 A에는 내가 실제로 한 행동이 잘 보이게 해줘.\n\n제공하지 않은 수치·성과는 만들지 마.\n\n마지막에 이 경험을 사무행정의 정확성·자료관리·인수인계 역량과 연결해 핵심 문장 2개를 만들어줘.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"AI 자기소개서","title":"STAR → 자기소개서 프롬프트","body":"앞에서 완성한 STAR 경험을 이용해 [사무행정직] 자기소개서 문단을 작성해줘.\n\n \n\n조건:\n\n1. 첫 문장은 나의 핵심 강점을 두괄식으로 작성\n\n2. 추상적인 성격 표현보다 실제 행동 중심\n\n3. STAR 경험이 자연스럽게 드러나도록 작성\n\n4. 마지막에는 지원 직무와 연결\n\n5. 내가 제공하지 않은 경험·수치·성과는 추가하지 않기\n\n6. 과장된 표현과 누구에게나 적용되는 상투적인 문장은 줄이기\n\n \n\n작성 후, 사용한 STAR 요소를 S/T/A/R로 다시 표시해줘.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"AI 자기소개서","title":"자기소개서 검증 프롬프트","body":"아래 자기소개서를 채용담당자의 관점에서 검토해줘.\n\n \n\n다음 항목만 확인해줘.\n\n1. 추상적인 표현\n\n2. 근거가 부족한 강점\n\n3. 내가 직접 한 행동이 보이지 않는 부분\n\n4. 지원 직무와 연결되지 않는 내용\n\n5. 내가 제공하지 않은 사실·수치·성과\n\n6. AI가 작성한 것처럼 지나치게 완벽하거나 상투적인 문장\n\n \n\n바로 다시 쓰지 말고, 먼저 “문제 문장 / 이유 / 수정 방향” 표로 알려줘.\n\n \n\n[자기소개서 붙여넣기]","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"자소서 비서","title":"경험 카드","body":"TXT\n\n경험카드_박지현_실습용","comments":[],"attachments":[{"label":"TXT","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/E1P8aXr56V68ZwA9"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"자소서 비서","title":"지침 템플릿 ① 역할 · 내 정보 · 작성 원칙","body":"[역할] 너는 나의 자기소개서 작성을 돕는 커리어 코치다.\n\n[내 정보] 내 이력과 경험은 업로드한 {경험 카드} 파일에 있다. 반드시 이 파일의 경험만 사용한다.\n\n[작성 원칙]\n\n1. 파일에 없는 경험, 수치, 성과는 절대 지어내지 않는다. 부족하면 나에게 질문한다.\n\n2. 채용공고를 받으면 먼저 인재상과 직무 핵심역량을 3줄로 정리한다.\n\n3. 각 문항에 어울리는 경험 카드를 2개 추천하고 이유를 설명한다.\n\n4. 초안은 내가 먼저 쓰고, 너는 첨삭만 한다. 내가 \"초안 써줘\"라고 할 때만 직접 쓴다.\n\n5. 첨삭할 때는 내 말투를 유지하고, 고친 이유를 짧게 덧붙인다.\n\n[금지]\n\n{열정, 성실, 최선을 다하는} 같은 추상적 표현만으로 문장을 끝내지 않는다.\n\n과장된 미사여구를 쓰지 않는다.\n\n \n\n[출력 형식]\n\n문항별로 구분하고, 글자 수를 함께 표시한다.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"자소서 비서","title":"내 비서, 제대로 일하나요? 작동 테스트","body":"지침과 파일을 잘 읽었는지 확인할게.\n\n내 강점 {3}가지를 경험 카드 근거와 함께 말해줘.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"자소서 비서","title":"기업 맞춤 분석과 매칭","body":"아래는 지원할 기업의 채용공고야.\n\n지침에 따라 분석하고,  \"{지원동기 및 입사 후 포부}({700}자)\"에 맞는 경험을 추천해줘.\n\n \n\n{채용공고 전문 붙여넣기}","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"자소서 비서","title":"자소서 첨삭","body":"아래는 내가 직접 쓴 초안이야. 지침에 따라 첨삭해줘.\n\n{내가 쓴 초안 붙여넣기}","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"자소서 비서","title":"[자기소개서 초안]","body":"저는 경상남도 김해에서 2남 1녀중 막내로 태어나 화목한 가정에서 자랐습니다. 부모님께서는 항상 성실하게 살아야 한다고 말씀하셨고 저는 그 가르침을 지금까지 지키며 살아오고 있습니다.\n\n대학 졸업 후 중소기업 경리부서에서 약 8년간 근무하였습니다. 회사에서 여러가지 일을 했는데 엑셀로 장부 정리도 하고 거래처 전화응대도 하고 신입직원 업무도 알려주었습니다. 결혼과 출산으로 회사를 그만두게 되었고 그 후 15년 정도 아이들을 키우느라 일을 하지 못했습니다. 경력이 많이 끊겨서 걱정이 되기도 하지만 그래도 열심히 하면 될거라고 생각합니다.\n\n아이들이 어느정도 크고 나서 주민센터에서 하는 스마트폰 교육을 듣게 되었습니다. 처음에는 왠만한 기능도 잘 몰랐는데 몇일 배우다 보니 재미가 붙었고 지금은 챗GPT도 조금 쓸 줄 압니다. 교육을 들으면서 옆자리 어르신들이 잘 못따라 하시면 제가 도와드리기도 했는데 그때 너무 뿌듯했습니다. 그래서 저도 누군가를 가르치는 일을 해보고 싶다는 생각이 들었습니다.\n\n저의 강점은 성실함과 책임감입니다. 저는 한번 맡은 일은 끝까지 하는 성격이고 사람들과도 잘 어울립니다. 또 꼼꼼한 편이라 실수가 적습니다. 그리고 컴퓨터도 어느 정도 다룰 줄 압니다.\n\n비록 부족한 점이 많지만 저를 뽑아주신다면 누구보다 열심히 하겠습니다. 기회를 주시면 실망시켜 드리지 않도록 최선을 다하겠습니다. 감사합니다.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"채용공고","title":"방과후 교육 보조강사","body":"PDF\n\n방과후 교육보조강사 채용 공고","comments":[],"attachments":[{"label":"PDF","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/goElQy5E6R1wQ3yY"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"채용공고","title":"아이돌봄 선생님","body":"PDF\n\n아이돌봄 선생님 채용 공고","comments":[],"attachments":[{"label":"PDF","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/jpoxajRjN4XyabPE"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"채용공고","title":"행정사무보조원","body":"PDF\n\n행정사무보조원 채용 공고","comments":[],"attachments":[{"label":"PDF","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/BJkrQA1nKjN0QEge"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"경력기술서","title":"제미나이노트북 실습자료","body":"ZIP\n•\n178 KB\n\n제미나이노트북실습자료","comments":[],"attachments":[{"label":"ZIP 178 KB","url":"https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/3378719418/b0ebc30e6836f751e5c7041076203770/___________.zip?expiry_token=5WaHZRdGG3LkUVQGy3SZ-zdRtq89aJeottSBaF_Hii8dmxJqYDvE2-MDbblcM-ZrVekXW99RReKkJFIoMoKio25mFrj3EsG_TbhRpgN__LCVX0UMrsM97tYjzg0AWyf7LTo3DnVwuLAjWWgfExa1w23hmV72HX8ROBlNjASG7SnwJgUSUtCzixnpjhgP1QSPmkpN2VmJae7gh4c7FWruxhzMclVNibiYL2pt2YpJeAM=&download=1"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"경력기술서","title":"성과 추출하기","body":"업로드한 자료를 바탕으로 내가 수행한 업무와 성과를 모두 찾아줘.\n\n각 항목을 상황(S) - 과제(T) - 행동(A) - 결과(R)로 정리하고,\n\n숫자로 표현할 수 있는 성과는 따로 표시해줘.\n\n자료에 없는 내용은 추측하지 말고 \"확인 필요\"라고 적어줘.\n\n대상 기간: {최근 5년}","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"경력기술서","title":"채용공고와 내 경험 연결하기","body":"미래로테크의 교육기획 채용공고를 소스로 추가했어.\n\n채용공고의 자격요건과 우대사항을 항목별로 정리하고,\n\n각 항목에 해당하는 내 경험을 내 자료에서 찾아 표로 연결해줘.\n\n표는 \"요구 역량 | 내 경험 | 근거 자료\" 순서로 만들고,\n\n부족한 역량은 별도로 표시해줘.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"경력기술서","title":"경력기술서 작성하기","body":"앞에서 만든 매칭표를 바탕으로 {지원 직무}용 경력기술서를 작성해줘.\n\n프로젝트별로 기간 / 역할 / 주요 업무 / 성과(정량) 순서로 쓰고,\n\n채용공고의 핵심 키워드를 자연스럽게 반영해줘.\n\n분량은 {A4 2쪽} 이내, 문장은 \"~함\", \"~달성\" 형태로 간결하게.\n\n내 자료에 근거가 없는 내용은 쓰지 말아줘.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"경력기술서","title":"면접까지 대비하기","body":"이 경력기술서를 본 {지원 회사} 면접관이 물어볼 만한 질문 {10}개를 만들어줘.\n\n각 질문에 대해 내 자료를 근거로 답변 포인트를 3줄 이내로 정리하고,\n\n근거가 약해서 추가 준비가 필요한 질문은 따로 표시해줘.","comments":[],"attachments":[],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"채용공고","title":"한빛시평생교육진흥원","body":"PDF\n\n08_채용공고_한빛시평생교육진흥원_평생교육사","comments":[],"attachments":[{"label":"PDF","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/J24jalRwL673Z0A1"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"채용공고","title":"런업에듀_기업교육컨설턴트","body":"PDF\n\n09_채용공고_런업에듀_기업교육컨설턴트","comments":[],"attachments":[{"label":"PDF","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/do3MQJdAoR31W15w"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"},{"section":"채용공고","title":"다온사회적협동조합_청년사업PM","body":"PDF\n\n11_채용공고_다온사회적협동조합_청년사업PM","comments":[],"attachments":[{"label":"PDF","url":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq/wish/MbejW1KEkxDnQNkG"}],"source":"https://padlet.com/bijeonsulsa/1106-s0254ju0v3ir0lr1mrzq"}];const groups=[...new Set(posts.map(p=>p.section))];let active='전체';const filters=document.getElementById('filters');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){filters.innerHTML=['전체',...groups].map(g=>'<button class="'+(g===active?'active':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</button>').join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.g;render()});const q=document.getElementById('q').value.trim().toLowerCase();const shown=posts.map((p,i)=>({...p,i})).filter(p=>(active==='전체'||p.section===active)&&(!q||(p.title+' '+p.body+' '+p.section).toLowerCase().includes(q)));const by={};shown.forEach(p=>(by[p.section]??=[]).push(p));document.getElementById('content').innerHTML=Object.entries(by).map(([g,list])=>'<section class="section"><h2>'+esc(g)+' <span class="count">'+list.length+'개</span></h2><div class="grid">'+list.map(p=>'<article class="card"><h3>'+esc(p.title)+'</h3><div class="body">'+esc(p.body)+'</div>'+(p.attachments.length?p.attachments.map(a=>'<a class="attachment" href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.label)+' 원문 첨부 열기 ↗</a>').join(''):'')+(p.comments||[]).map(c=>'<div class="comment"><b>원문 댓글</b><br>'+esc(c)+'</div>').join('')+'<button class="copy" data-i="'+p.i+'">본문 복사</button></article>').join('')+'</div></section>').join('')||'<p class="empty">검색 결과가 없습니다.</p>';document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const p=posts[Number(b.dataset.i)];await navigator.clipboard.writeText(p.body);b.textContent='복사 완료';setTimeout(()=>b.textContent='본문 복사',1400)});}document.getElementById('q').addEventListener('input',render);render();</script></body></html>
